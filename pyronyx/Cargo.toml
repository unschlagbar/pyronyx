[package]
name = "pyronyx"
version = "0.5.1+1.4.363"
edition = "2024"
rust-version = "1.85.0"
license = "MIT"
repository = "https://github.com/unschlagbar/pyronyx"
readme = "README.md"
keywords = ["gamedev", "graphics", "vulkan", "bindings"]
description = "Better Vulkan bindings for Rust"
categories = [
    "api-bindings",
    "external-ffi-bindings",
    "game-development",
    "graphics",
    "rendering::graphics-api",
]

[dependencies]
raw-window-handle = { version = "0.6.2", optional = true }
libloading = { version = "0.9", optional = true }

# Bridges an AppKit NSView to the CAMetalLayer that Metal surface creation needs.
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-metal = "1"

[features]
default = []
rwh_06 = ["raw-window-handle"]
# Loads the Vulkan loader at runtime with `pyronyx::load` instead of linking it.
loaded = ["libloading"]
